name: Build signed APK (manual)

# Manual trigger only: Actions tab -> "Build signed APK (manual)" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [release, debug]
        default: release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        # Optional: set repo secrets RELEASE_STORE_BASE64 / RELEASE_STORE_PASSWORD /
        # RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD to use your own key.
        # Otherwise the bundled keystore/static-radio.jks is used (APK is always signed).
        env:
          RELEASE_STORE_BASE64: ${{ secrets.RELEASE_STORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_STORE_BASE64" ]; then
            echo "$RELEASE_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          else
            unset RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD
          fi
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew :app:assembleDebug --console=plain
          else
            ./gradlew :app:assembleRelease --console=plain
          fi

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in app/build/outputs/apk/*/*.apk; do "$APKSIGNER" verify --verbose "$f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: static-radio-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/**/*.apk
